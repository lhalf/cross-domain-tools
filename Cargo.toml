[workspace]
members = ["import/http/receiver", "import/http/sender", "import/http/common", "import/http/tests", "common", "import/grpc/sender", "import/grpc/receiver"]
resolver = "3"

[workspace.dependencies]
tokio = { version = "1.52.3", default-features = false }
serde = { version = "1.0.228", default-features = false }
anyhow = { version = "1.0.103", default-features = false }
uuid = { version = "1.23.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
