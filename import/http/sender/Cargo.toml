[package]
name = "import-http-sender"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4"] }
axum = { version = "0.8.8", default-features = false, features = ["tokio", "http1"] }
tokio-util = { version = "0.7.18", default-features = false }
log = { version = "0.4.29", default-features = false }
env_logger = { version = "0.11.8", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
toml = { version = "0.9.11", default-features = false, features = ["serde", "parse"] }
async-trait = { version = "0.1.89", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[dependencies.import-http-common]
path = "../common"

[dependencies.common]
path = "../../../common"

[dev-dependencies.import-http-common]
path = "../common"
features = ["test"]

[dev-dependencies.common]
path = "../../../common"
features = ["test"]

[dev-dependencies]
autospy = { version = "1.6.1", default-features = false, features = ["async"]}

[lints]
workspace = true