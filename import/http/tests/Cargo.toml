[package]
name = "import-http-tests"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
retry = { version = "2.2.0", default-features = false }
parameterized = { version = "2.1.0", default-features = false }

[lib]
doctest = false

[lints]
workspace = true
